
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Home Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 8%;
      background: white;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #4f46e5;
    }

    nav a {
      text-decoration: none;
      color: #333;
      margin-left: 25px;
    }

    nav a:hover {
      color: #4f46e5;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .hero h1 {
      font-size: 52px;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #4f46e5;
    }

    .hero p {
      font-size: 18px;
      color: #666;
      max-width: 550px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: #4f46e5;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .btn:hover {
      background: #3730a3;
    }

    footer {
      text-align: center;
      padding: 22px;
      color: #777;
      background: white;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 18px;
      }

      nav a {
        margin: 0 8px;
      }

      .hero h1 {
        font-size: 36px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">MyWebsite</div>
    <nav>
      <a href="#">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Welcome to <span>My Website</span></h1>
    <p>
      A simple place to share your ideas, showcase your work,
      and connect with the world. Explore and discover something new!
    </p>
    <a href="#about" class="btn">Get Started</a>
  </section>

  <footer>
    <p>© 2026 MyWebsite. All rights reserved.</p>
  </footer>

</body>
</html>
